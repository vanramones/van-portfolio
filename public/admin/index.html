<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050813" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Van.dev · Admin</title>
    <link rel="manifest" href="/admin/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/admin/icons/icon-192.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg:       #050813;
        --bg2:      #0a0f1e;
        --bg3:      #0e1428;
        --border:   rgba(99,102,241,.18);
        --border2:  rgba(99,102,241,.08);
        --accent:   #6366f1;
        --accent2:  #3b82f6;
        --green:    #22c55e;
        --red:      #f87171;
        --yellow:   #fbbf24;
        --text:     #e8eaf6;
        --muted:    #7580a8;
        --card:     rgba(10,15,30,.8);
        --sidebar:  200px;
        --radius:   14px;
      }
      body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
             min-height:100vh; display:flex; }

      /* ── LOGIN ── */
      #login { position:fixed; inset:0; display:flex; align-items:center;
               justify-content:center; background:var(--bg); z-index:50; padding:20px; }
      #login.hidden { display:none; }
      .login-wrap { width:100%; max-width:360px; }
      .login-logo { text-align:center; margin-bottom:32px; }
      .login-logo span { font-size:34px; font-weight:800;
        background:linear-gradient(135deg,var(--accent2),var(--accent));
        -webkit-background-clip:text; background-clip:text; color:transparent; }
      .login-logo p { font-size:13px; color:var(--muted); margin-top:6px; }
      .login-card { background:var(--bg2); border:1px solid var(--border); border-radius:20px; padding:32px; }
      .login-card label { display:block; font-size:12px; font-weight:600;
                          color:var(--muted); letter-spacing:.04em; margin-bottom:6px; }
      .login-card input { width:100%; padding:13px 16px; background:var(--bg3); border:1px solid var(--border);
        border-radius:10px; color:var(--text); font:inherit; font-size:14px; outline:none; }
      .login-card input:focus { border-color:var(--accent); }
      .login-err { min-height:18px; font-size:12.5px; color:var(--red); margin:10px 0 4px; }
      .btn-login { width:100%; margin-top:4px; padding:13px; border:none; border-radius:10px;
        background:linear-gradient(135deg,var(--accent2),var(--accent));
        color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer;
        letter-spacing:.02em; transition:opacity .2s; }
      .btn-login:hover { opacity:.88; }

      /* ── SHELL ── */
      #shell { display:flex; width:100%; min-height:100vh; }
      #shell.hidden { display:none; }

      /* ── SIDEBAR ── */
      #sidebar { width:var(--sidebar); flex-shrink:0; background:var(--bg2);
        border-right:1px solid var(--border2); display:flex; flex-direction:column;
        position:sticky; top:0; height:100vh; overflow-y:auto; padding:24px 0 20px; }
      .sb-logo { padding:0 20px 28px; }
      .sb-logo span { font-size:20px; font-weight:800;
        background:linear-gradient(135deg,var(--accent2),var(--accent));
        -webkit-background-clip:text; background-clip:text; color:transparent; }
      .sb-logo small { display:block; font-size:11px; color:var(--muted); margin-top:2px; }
      .sb-section { padding:0 12px; margin-bottom:6px; }
      .sb-label { font-size:10px; font-weight:600; letter-spacing:.08em; color:var(--muted);
                  padding:0 8px; margin-bottom:6px; }
      .sb-item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
        font-size:13px; font-weight:500; color:var(--muted); cursor:pointer;
        border:none; background:none; width:100%; text-align:left; transition:all .15s; }
      .sb-item:hover { background:rgba(99,102,241,.08); color:var(--text); }
      .sb-item.active { background:rgba(99,102,241,.14); color:var(--text); }
      .sb-item .ico { width:18px; text-align:center; font-size:15px; }
      .sb-badge { margin-left:auto; background:var(--accent); color:#fff; font-size:10px;
                  font-weight:700; padding:2px 7px; border-radius:20px; }
      .sb-divider { border:none; border-top:1px solid var(--border2); margin:14px 12px; }
      .sb-bottom { margin-top:auto; padding:0 12px; }
      .sb-avatar { display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px;
                   background:var(--bg3); }
      .sb-avatar .av { width:32px; height:32px; border-radius:50%;
        background:linear-gradient(135deg,var(--accent2),var(--accent));
        display:flex; align-items:center; justify-content:center;
        font-size:14px; font-weight:800; color:#fff; flex-shrink:0; }
      .sb-avatar .av-info { min-width:0; }
      .sb-avatar .av-name { font-size:12px; font-weight:600; }
      .sb-avatar .av-role { font-size:10px; color:var(--muted); }

      /* ── MAIN ── */
      #main { flex:1; display:flex; flex-direction:column; min-width:0; }

      /* ── TOPBAR ── */
      #topbar { display:flex; align-items:center; gap:14px; padding:18px 28px;
        border-bottom:1px solid var(--border2); background:rgba(5,8,19,.85);
        backdrop-filter:blur(14px); position:sticky; top:0; z-index:5; }
      #topbar h2 { font-size:16px; font-weight:700; flex:1; }
      .tb-dot { width:8px; height:8px; border-radius:50%; background:var(--green);
                box-shadow:0 0 8px var(--green); }
      .tb-time { font-size:12px; color:var(--muted); }
      .icon-btn { background:none; border:1px solid var(--border); color:var(--muted);
        padding:6px 14px; border-radius:8px; font:inherit; font-size:12px; font-weight:500;
        cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .15s; }
      .icon-btn:hover { border-color:var(--accent); color:var(--text); }

      /* ── CONTENT ── */
      #content { flex:1; padding:28px; overflow-y:auto; }

      /* ── STATS ROW ── */
      .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
      .stat-card { background:var(--card); border:1px solid var(--border2); border-radius:var(--radius);
                   padding:18px 20px; }
      .stat-card .s-label { font-size:11px; font-weight:600; letter-spacing:.06em;
                            color:var(--muted); margin-bottom:10px; }
      .stat-card .s-val { font-size:28px; font-weight:800; line-height:1; }
      .stat-card .s-sub { font-size:11px; color:var(--muted); margin-top:6px; }
      .stat-card.unread .s-val { color:var(--accent2); }
      .stat-card.total  .s-val { color:var(--text); }
      .stat-card.files  .s-val { color:var(--yellow); }
      .stat-card.today  .s-val { color:var(--green); }

      /* ── FILTER BAR ── */
      .filter-bar { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
      .filter-bar h3 { font-size:15px; font-weight:700; flex:1; }
      .filter-pill { padding:5px 14px; border-radius:20px; font-size:12px; font-weight:600;
        border:1px solid var(--border); background:none; color:var(--muted); cursor:pointer;
        transition:all .15s; }
      .filter-pill.on { background:var(--accent); border-color:var(--accent); color:#fff; }
      .filter-pill:hover:not(.on) { border-color:var(--accent); color:var(--text); }

      /* ── INBOX LIST ── */
      #list { display:flex; flex-direction:column; gap:12px; }

      /* ── EMPTY STATE ── */
      .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center;
        padding:80px 20px; gap:16px; text-align:center; }
      .empty-icon { width:72px; height:72px; border-radius:20px;
        background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(59,130,246,.1));
        border:1px solid var(--border); display:flex; align-items:center;
        justify-content:center; font-size:30px; }
      .empty-state h3 { font-size:18px; font-weight:700; }
      .empty-state p { font-size:13px; color:var(--muted); max-width:300px; line-height:1.6; }

      /* ── MESSAGE CARD ── */
      .msg-card { background:var(--card); border:1px solid var(--border2); border-radius:var(--radius);
        padding:20px 22px; transition:border-color .15s; }
      .msg-card.unread { border-left:3px solid var(--accent); }
      .msg-card:hover { border-color:var(--border); }

      .msg-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
      .msg-avatar { width:40px; height:40px; border-radius:12px; flex-shrink:0;
        background:linear-gradient(135deg,var(--accent2),var(--accent));
        display:flex; align-items:center; justify-content:center;
        font-size:16px; font-weight:800; color:#fff; text-transform:uppercase; }
      .msg-meta { flex:1; min-width:0; }
      .msg-name { font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; }
      .unread-dot { width:7px; height:7px; border-radius:50%; background:var(--accent2);
                    display:inline-block; flex-shrink:0; }
      .msg-email { font-size:12px; color:var(--muted); margin-top:2px; }
      .msg-time { font-size:11px; color:var(--muted); flex-shrink:0; }

      .msg-subject { font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text); }
      .msg-body { font-size:13px; color:#9ba3c4; line-height:1.65; margin-bottom:14px;
                  white-space:pre-wrap; }
      .msg-body.collapsed { display:-webkit-box; -webkit-line-clamp:3;
                            -webkit-box-orient:vertical; overflow:hidden; }

      .msg-files { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
      .file-chip { display:inline-flex; align-items:center; gap:7px; padding:6px 12px;
        border-radius:8px; font-size:12px; font-weight:500; color:#a5b4fc;
        background:rgba(99,102,241,.1); border:1px solid rgba(99,102,241,.2);
        cursor:pointer; transition:all .15s; max-width:220px; }
      .file-chip:hover { background:rgba(99,102,241,.2); border-color:rgba(99,102,241,.4); }
      .file-chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .file-icon { flex-shrink:0; font-size:13px; }

      .msg-actions { display:flex; align-items:center; gap:8px;
                     border-top:1px solid var(--border2); padding-top:12px; }
      .act-btn { display:inline-flex; align-items:center; gap:6px; padding:6px 12px;
        border-radius:8px; font:inherit; font-size:12px; font-weight:500;
        border:1px solid var(--border); background:none; color:var(--muted); cursor:pointer;
        transition:all .15s; }
      .act-btn:hover { border-color:var(--border); color:var(--text); background:var(--bg3); }
      .act-btn.reply { color:var(--accent2); border-color:rgba(59,130,246,.3); }
      .act-btn.reply:hover { background:rgba(59,130,246,.08); }
      .act-btn.del { margin-left:auto; color:var(--red); border-color:rgba(248,113,113,.25); }
      .act-btn.del:hover { background:rgba(248,113,113,.07); }
      .expand-btn { background:none; border:none; font:inherit; font-size:12px;
                    color:var(--accent); cursor:pointer; padding:0 2px; }

      /* ── SCROLLBAR ── */
      ::-webkit-scrollbar { width:4px; }
      ::-webkit-scrollbar-track { background:transparent; }
      ::-webkit-scrollbar-thumb { background:rgba(99,102,241,.25); border-radius:4px; }

      /* ── RESPONSIVE ── */
      @media(max-width:760px){
        :root { --sidebar:0px; }
        #sidebar { display:none; }
        .stats-row { grid-template-columns:repeat(2,1fr); }
        #content { padding:16px; }
        #topbar { padding:14px 16px; }
      }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div id="login">
      <div class="login-wrap">
        <div class="login-logo">
          <span>Van.dev</span>
          <p>Admin Dashboard</p>
        </div>
        <div class="login-card">
          <form id="login-form">
            <label for="pw">Password</label>
            <input id="pw" type="password" placeholder="Enter admin password"
                   autocomplete="current-password" required />
            <p class="login-err" id="login-err"></p>
            <button class="btn-login" type="submit">Sign In →</button>
          </form>
        </div>
      </div>
    </div>

    <!-- SHELL -->
    <div id="shell" class="hidden">
      <!-- SIDEBAR -->
      <aside id="sidebar">
        <div class="sb-logo">
          <span>Van.dev</span>
          <small>Admin Panel</small>
        </div>
        <div class="sb-section">
          <div class="sb-label">MAIN</div>
          <button class="sb-item active" id="nav-inbox">
            <span class="ico">✉</span> Inbox
            <span class="sb-badge" id="sb-unread" style="display:none"></span>
          </button>
        </div>
        <hr class="sb-divider" />
        <div class="sb-section">
          <div class="sb-label">LINKS</div>
          <a class="sb-item" href="https://itsvan.vercel.app" target="_blank" style="text-decoration:none">
            <span class="ico">🌐</span> Portfolio
          </a>
          <a class="sb-item" href="https://supabase.com/dashboard" target="_blank" style="text-decoration:none">
            <span class="ico">🗄</span> Supabase
          </a>
        </div>
        <div class="sb-bottom">
          <div class="sb-avatar">
            <div class="av">V</div>
            <div class="av-info">
              <div class="av-name">Van Ramones</div>
              <div class="av-role">Administrator</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- MAIN -->
      <div id="main">
        <header id="topbar">
          <div class="tb-dot"></div>
          <h2>Message Inbox</h2>
          <span class="tb-time" id="tb-time"></span>
          <button class="icon-btn" id="refresh">↻ Refresh</button>
          <button class="icon-btn" id="logout">Sign Out</button>
        </header>

        <div id="content">
          <!-- STATS -->
          <div class="stats-row">
            <div class="stat-card unread">
              <div class="s-label">UNREAD</div>
              <div class="s-val" id="st-unread">—</div>
              <div class="s-sub">new messages</div>
            </div>
            <div class="stat-card total">
              <div class="s-label">TOTAL</div>
              <div class="s-val" id="st-total">—</div>
              <div class="s-sub">all time</div>
            </div>
            <div class="stat-card today">
              <div class="s-label">TODAY</div>
              <div class="s-val" id="st-today">—</div>
              <div class="s-sub">received today</div>
            </div>
            <div class="stat-card files">
              <div class="s-label">WITH FILES</div>
              <div class="s-val" id="st-files">—</div>
              <div class="s-sub">have attachments</div>
            </div>
          </div>

          <!-- FILTER -->
          <div class="filter-bar">
            <h3>Messages</h3>
            <button class="filter-pill on" data-filter="all">All</button>
            <button class="filter-pill" data-filter="unread">Unread</button>
            <button class="filter-pill" data-filter="files">Has Files</button>
          </div>

          <!-- LIST -->
          <div id="list"></div>
        </div>
      </div>
    </div>

    <script src="/admin/admin.js"></script>
  </body>
</html>
